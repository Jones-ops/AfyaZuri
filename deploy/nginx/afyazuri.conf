# OPTIONAL reverse proxy in front of `npm start` (Node serves the app itself, so Nginx
# is only needed if you want it to terminate TLS, e.g. with a Let's Encrypt
# certificate for a cloud host, or to serve several sites on one machine).
#
# Afyazuri listens on 127.0.0.1:4000 behind this proxy; set TRUST_PROXY=loopback in .env.

upstream afyazuri {
  server 127.0.0.1:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name afyazuri.example.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name afyazuri.example.org;

  ssl_certificate     /etc/letsencrypt/live/afyazuri.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afyazuri.example.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 20m;

  # The API already compresses responses; Nginx only passes them through.
  gzip off;

  # Metrics are for the monitoring network only.
  location = /metrics { deny all; }

  location / {
    proxy_pass http://afyazuri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }
}
