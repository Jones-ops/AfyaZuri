openapi: 3.1.0
info:
  title: Afyazuri API
  version: 0.2.0
  description: |
    Endpoints of the Afyazuri hospital management system (Phase 1 foundation and Phase 2 patients). Conventions (cookies, CSRF header,
    errors, pagination, idempotency) are described in docs/api.md.
servers:
  - url: /api/v1
security:
  - cookieAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Facilities
  - name: Audit
  - name: Patients
  - name: OPD

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string }
                totp: { type: string, pattern: '^\d{6}$', description: Required when the account has 2FA }
                facilityId: { type: string, format: uuid }
      responses:
        '200':
          {
            description: Signed in; az_at and az_rt cookies set,
            content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and issue a new access token
      security: [{ refreshCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { description: New cookies set }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the session (works with an expired access token)
      security: []
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Signed out; cookies cleared } }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user, facility, roles and effective permissions
      responses:
        '200':
          description: Profile
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password (ends the user's other sessions)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 10 } }
      responses: { '200': { description: Changed }, '400': { $ref: '#/components/responses/Error' } }
  /auth/switch-facility:
    post:
      tags: [Auth]
      summary: Change the session's active facility
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [facilityId], properties: { facilityId: { type: string, format: uuid } } },
              },
          }
      responses: { '200': { description: Switched }, '403': { $ref: '#/components/responses/Error' } }
  /auth/totp/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrolment
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200':
          description: Secret and otpauth URL for an authenticator app
          content:
            {
              application/json:
                { schema: { type: object, properties: { secret: { type: string }, otpauthUrl: { type: string } } } },
            }
  /auth/totp/enable:
    post:
      tags: [Auth]
      summary: Confirm enrolment with a code
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { $ref: '#/components/requestBodies/TotpCode' }
      responses: { '200': { description: Enabled }, '400': { $ref: '#/components/responses/Error' } }
  /auth/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off 2FA (requires a current code)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { $ref: '#/components/requestBodies/TotpCode' }
      responses: { '200': { description: Disabled }, '400': { $ref: '#/components/responses/Error' } }

  /roles:
    get:
      tags: [Users]
      summary: Roles with permissions, and the permission catalogue
      x-permissions: [roles.read]
      responses: { '200': { description: Roles } }
  /users:
    get:
      tags: [Users]
      summary: Staff at the active facility (all staff for deployment admins)
      x-permissions: [users.read]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Name or username contains }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled, all], default: active } }
      responses:
        '200':
          description: Page of users
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          data: { type: array, items: { $ref: '#/components/schemas/User' } },
                          nextCursor: { type: [string, 'null'] },
                        },
                    },
                },
            }
    post:
      tags: [Users]
      summary: Create a staff account
      x-permissions: [users.manage]
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUser' } } }
      responses:
        '201':
          { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Users]
      x-permissions: [users.read]
      responses:
        {
          '200':
            { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } },
          '404': { $ref: '#/components/responses/Error' },
        }
    patch:
      tags: [Users]
      summary: Edit profile fields
      x-permissions: [users.manage]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: [string, 'null'], format: email }
                phone: { type: [string, 'null'], description: Kenyan number; normalised to +254 }
                licenceBody: { type: [string, 'null'], enum: [KMPDC, NCK, PPB, KMLTTB, COC, RPB, OTHER, null] }
                licenceNumber: { type: [string, 'null'] }
                cadre: { type: [string, 'null'] }
      responses: { '200': { description: Updated } }
  /users/{id}/roles:
    put:
      tags: [Users]
      summary: Replace role assignments (facility admins replace only their facility's)
      x-permissions: [users.manage]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [roles],
                    properties: { roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } } },
                  },
              },
          }
      responses: { '200': { description: Updated user } }
  /users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable the account and end its sessions
      x-permissions: [users.disable]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } },
          }
      responses: { '200': { description: Disabled } }
  /users/{id}/enable:
    post:
      {
        tags: [Users],
        x-permissions: [users.disable],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Enabled } },
      }
  /users/{id}/force-logout:
    post:
      tags: [Users]
      x-permissions: [users.disable]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        {
          '200':
            {
              description: Sessions ended,
              content:
                { application/json: { schema: { type: object, properties: { sessionsEnded: { type: integer } } } } },
            },
        }
  /users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Set a temporary password (user must change it; sessions end)
      x-permissions: [users.manage]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { type: object, required: [password], properties: { password: { type: string } } } },
            },
        }
      responses: { '200': { description: Reset } }
  /users/{id}/unlock:
    post:
      {
        tags: [Users],
        x-permissions: [users.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Unlocked } },
      }

  /facilities:
    get:
      {
        tags: [Facilities],
        summary: Facilities the user can access,
        x-permissions: [facilities.read],
        responses: { '200': { description: List } },
      }
    post:
      tags: [Facilities]
      summary: Add a facility (deployment admins only)
      x-permissions: [facilities.manage (deployment-wide)]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kmhflCode, level, ownership]
              properties:
                name: { type: string }
                kmhflCode: { type: string, pattern: '^\d{4,6}$' }
                level: { type: string, enum: [level_2, level_3, level_4, level_5, level_6] }
                ownership: { type: string, enum: [moh, county, faith_based, private, ngo] }
                countyCode: { type: [string, 'null'] }
                mrnFormat: { type: string, default: '{facility_code}-{year}-{seq}' }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Error' } }
  /facilities/current:
    get:
      { tags: [Facilities], x-permissions: [facilities.read], responses: { '200': { description: Active facility } } }
  /facilities/{id}:
    patch:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Updated } },
      }
  /departments:
    get:
      {
        tags: [Facilities],
        x-permissions: [facilities.read],
        responses: { '200': { description: Departments of the active facility } },
      }
    post:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Csrf' }],
        responses: { '201': { description: Created } },
      }
  /departments/{id}:
    patch:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Updated } },
      }
  /service-points:
    get: { tags: [Facilities], x-permissions: [facilities.read], responses: { '200': { description: Service points } } }
    post:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Csrf' }],
        responses: { '201': { description: Created } },
      }
  /service-points/{id}:
    patch:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Updated } },
      }
  /wards:
    get:
      {
        tags: [Facilities],
        summary: Wards with bed counts by status,
        x-permissions: [facilities.read, ipd.read],
        responses: { '200': { description: Wards } },
      }
    post:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Csrf' }],
        responses: { '201': { description: Created } },
      }
  /wards/{id}:
    patch:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Updated } },
      }
  /wards/{id}/beds:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { tags: [Facilities], x-permissions: [facilities.read, ipd.read], responses: { '200': { description: Beds } } }
    post:
      {
        tags: [Facilities],
        x-permissions: [facilities.manage],
        parameters: [{ $ref: '#/components/parameters/Csrf' }],
        responses: { '201': { description: Created } },
      }
  /beds/{id}/status:
    patch:
      tags: [Facilities]
      summary: Housekeeping status (occupancy is set only by admissions)
      x-permissions: [facilities.manage, ipd.beds.manage]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [status],
                      properties: { status: { type: string, enum: [available, reserved, cleaning, out_of_service] } },
                    },
                },
            },
        }
      responses: { '200': { description: Updated }, '400': { $ref: '#/components/responses/Error' } }
  /settings:
    get:
      {
        tags: [Facilities],
        summary: Facility settings merged over deployment defaults,
        x-permissions: [settings.manage, facilities.read],
        responses: { '200': { description: Settings map } },
      }
  /settings/{key}:
    put:
      tags: [Facilities]
      x-permissions: [settings.manage]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{2,80}$' } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object, required: [value], properties: { value: {} } } } },
        }
      responses: { '200': { description: Saved } }

  /audit:
    get:
      tags: [Audit]
      summary: Audit entries (newest first)
      x-permissions: [audit.read]
      parameters: &auditFilters
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: Page of audit entries } }
  /audit/export:
    get:
      tags: [Audit]
      summary: CSV export (max 100 000 rows; the export is itself audited)
      x-permissions: [audit.export]
      parameters: *auditFilters
      responses: { '200': { description: CSV, content: { text/csv: {} } } }

  /patients:
    get:
      tags: [Patients]
      summary: Search by name, MRN, phone, national ID or SHA number (exact matches first)
      x-permissions: [patients.read]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Matches with masked phone numbers; `hint` explains queries that are too short
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PatientSummary' } }
                  nextCursor: { type: [string, 'null'] }
                  hint: { type: [string, 'null'] }
    post:
      tags: [Patients]
      summary: Register a patient (409 POSSIBLE_DUPLICATE unless duplicateOverrideReason is given)
      x-permissions: [patients.create]
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterPatient' } } }
      responses:
        '201':
          {
            description: Registered,
            content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } },
          }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /patients/duplicates:
    post:
      tags: [Patients]
      summary: Likely existing records for a person, scored with reasons
      x-permissions: [patients.create]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Candidates } }
  /patients/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Patients]
      summary: Full record (audited view). Allergies only with clinical access; 410 PATIENT_MERGED with details.survivorId
      x-permissions: [patients.read]
      responses:
        '200':
          { description: Patient, content: { application/json: { schema: { $ref: '#/components/schemas/Patient' } } } }
        '410': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Patients]
      summary: Edit demographics; `identifiers` replaces the full set
      x-permissions: [patients.update]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Updated patient } }
  /patients/{id}/restrict:
    post:
      tags: [Patients]
      summary: Mark or unmark a record as restricted (reason required)
      x-permissions: [patients.restrict]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Updated patient } }
  /patients/{id}/consents:
    post:
      tags: [Patients]
      summary: Record consent given or withdrawn (current consent version is stamped)
      x-permissions: [patients.consent.manage]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Updated patient } }
  /patients/{id}/payer-schemes:
    post:
      tags: [Patients]
      x-permissions: [patients.update]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Updated patient } }
  /patients/{id}/payer-schemes/{linkId}:
    delete:
      tags: [Patients]
      summary: Deactivate a payer scheme link
      x-permissions: [patients.update]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      responses: { '200': { description: Updated patient } }
  /patients/merge:
    post:
      tags: [Patients]
      summary: Merge a duplicate into the survivor; all linked records move, reversibly
      x-permissions: [patients.merge]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [survivorId, mergedId, reason]
              properties:
                {
                  survivorId: { type: string, format: uuid },
                  mergedId: { type: string, format: uuid },
                  reason: { type: string, minLength: 10 },
                }
      responses: { '200': { description: '{ mergeId, patient }' } }
  /patient-merges/{id}/unmerge:
    post:
      tags: [Patients]
      x-permissions: [patients.merge]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: '{ survivorId, restoredId }' } }
  /patients/{id}/merges:
    get:
      {
        tags: [Patients],
        x-permissions: [patients.merge],
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Merge history } },
      }
  /patients/{id}/break-glass:
    post:
      tags: [Patients]
      summary: Time-limited emergency access to a restricted record (reason required; audited and reviewed)
      x-permissions: [emr.break_glass]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 10 } } },
                },
            },
        }
      responses: { '201': { description: '{ grantId, expiresAt }' }, '400': { $ref: '#/components/responses/Error' } }
  /break-glass:
    get:
      tags: [Patients]
      summary: Emergency-access grants for review
      x-permissions: [audit.read]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [unreviewed, all], default: unreviewed } }]
      responses: { '200': { description: Grants } }
  /break-glass/{id}/review:
    post:
      tags: [Patients]
      x-permissions: [audit.read]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [outcome],
                      properties:
                        { outcome: { type: string, enum: [justified, unjustified] }, note: { type: [string, 'null'] } },
                    },
                },
            },
        }
      responses: { '200': { description: Reviewed }, '403': { $ref: '#/components/responses/Error' } }
  /schemes:
    get:
      {
        tags: [Patients],
        summary: Active payer schemes,
        x-permissions: [patients.read],
        responses: { '200': { description: Schemes } },
      }
  /admin-units/counties:
    get:
      {
        tags: [Patients],
        summary: The 47 counties,
        x-permissions: [patients.read],
        responses: { '200': { description: Counties } },
      }
  /admin-units/counties/{code}/sub-counties:
    get:
      {
        tags: [Patients],
        x-permissions: [patients.read],
        parameters: [{ name: code, in: path, required: true, schema: { type: string, pattern: '^\d{3}$' } }],
        responses: { '200': { description: Sub-counties } },
      }
  /admin-units/sub-counties/{id}/wards:
    get:
      {
        tags: [Patients],
        x-permissions: [patients.read],
        parameters: [{ name: id, in: path, required: true, schema: { type: integer } }],
        responses: { '200': { description: Wards } },
      }

  /encounters:
    get:
      tags: [OPD]
      summary: Visits (default open), each with its current queue ticket
      x-permissions: [opd.queue.read, patients.read]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, all], default: open } }
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 50 } }
      responses: { '200': { description: Visits } }
    post:
      tags: [OPD]
      summary: Check in — opens an OPD/emergency visit and queues the patient at the first step of their payer's route
      description: 409 ALREADY_CHECKED_IN (details.encounterId) when the patient already has an open visit. Idempotent on clientId.
      x-permissions: [opd.checkin]
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId]
              properties:
                patientId: { type: string, format: uuid }
                type: { type: string, enum: [opd, emergency], default: opd }
                patientPayerSchemeId: { type: [string, 'null'], format: uuid, description: omitted = cash }
                priority:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 2,
                    description: 0 routine,
                    1 urgent,
                    2 emergency (forced for emergency visits),
                  }
                clientId: { type: string, format: uuid }
      responses: { '201': { description: Visit with currentTicket }, '409': { $ref: '#/components/responses/Error' } }
  /encounters/{id}:
    get:
      {
        tags: [OPD],
        x-permissions: [opd.queue.read, patients.read],
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Visit with all tickets } },
      }
  /encounters/{id}/close:
    post:
      {
        tags: [OPD],
        summary: End a visit (closes any open ticket),
        x-permissions: [opd.checkin, opd.queue.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Closed visit } },
      }
  /queues:
    get:
      {
        tags: [OPD],
        summary: Queues with waiting/serving counts,
        longest wait and whether you can manage each,
        x-permissions: [opd.queue.read],
        responses: { '200': { description: Queues } },
      }
  /queues/{id}/board:
    get:
      {
        tags: [OPD],
        summary: Waiting,
        called and in-service tickets with patient details and the suggested next step,
        x-permissions: [opd.queue.read],
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Board } },
      }
  /queues/{id}/display:
    get:
      {
        tags: [OPD],
        summary: Public-screen view — ticket numbers only,
        no names,
        x-permissions: [opd.queue.read],
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Display } },
      }
  /queues/{id}/call-next:
    post:
      {
        tags: [OPD],
        summary: Call the next ticket (emergency,
        then urgent,
        then longest waiting); department-scoped,
        x-permissions: [opd.queue.manage],
        parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }],
        responses: { '200': { description: Called ticket }, '409': { $ref: '#/components/responses/Error' } },
      }
  /queue-tickets/{id}/{action}:
    post:
      tags: [OPD]
      summary: Ticket action; 409 INVALID_TRANSITION for impossible moves
      x-permissions: [opd.queue.manage]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: action, in: path, required: true, schema: { type: string, enum: [call, start, no-show, requeue] } }
        - { $ref: '#/components/parameters/Csrf' }
      responses: { '200': { description: Updated ticket } }
  /queue-tickets/{id}/complete:
    post:
      tags: [OPD]
      summary: Finish service and move on — next route step, a detour that returns here, or exit
      x-permissions: [opd.queue.manage]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                next:
                  oneOf:
                    - { type: object, properties: { kind: { const: route } } }
                    - {
                        type: object,
                        properties: { kind: { const: service_point }, servicePointId: { type: string, format: uuid } },
                      }
                    - { type: object, properties: { kind: { const: exit } } }
                note: { type: [string, 'null'] }
      responses: { '200': { description: '{ ticket, nextTicket, encounterClosed }' } }
  /opd-routes:
    get:
      {
        tags: [OPD],
        summary: Routes per payer type,
        x-permissions: [facilities.read, opd.queue.read],
        responses: { '200': { description: Routes } },
      }
    put:
      tags: [OPD]
      summary: Replace the route for a payer type (null = default); must start at registration and end at exit
      x-permissions: [facilities.manage]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [payerType, steps],
                    properties:
                      { payerType: { type: [string, 'null'] }, steps: { type: array, items: { type: string } } },
                  },
              },
          }
      responses: { '200': { description: Routes } }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: az_at }
    refreshCookie: { type: apiKey, in: cookie, name: az_rt }
  parameters:
    Csrf: { name: X-Afyazuri-Client, in: header, required: true, schema: { type: string, const: '1' } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: false,
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' },
      }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  requestBodies:
    TotpCode:
      required: true
      content:
        {
          application/json:
            { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^\d{6}$' } } } },
        }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Ok: { type: object, properties: { ok: { type: boolean } } }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
    RoleAssignment:
      type: object
      required: [role, facilityId]
      properties:
        role: { type: string, description: Role code, e.g. triage_nurse }
        facilityId:
          { type: [string, 'null'], format: uuid, description: null = every facility (deployment admins only) }
        departmentId: { type: [string, 'null'], format: uuid, description: null = every department }
    CreateUser:
      type: object
      required: [username, fullName, password, roles]
      properties:
        username: { type: string, pattern: '^[a-z0-9._-]{3,64}$' }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        password: { type: string, minLength: 10 }
        licenceBody: { type: [string, 'null'] }
        licenceNumber: { type: [string, 'null'] }
        cadre: { type: [string, 'null'] }
        mustChangePassword: { type: boolean, default: true }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RoleAssignment' } }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled] }
        locked: { type: boolean }
        mustChangePassword: { type: boolean }
        totpEnabled: { type: boolean }
        licenceBody: { type: [string, 'null'] }
        licenceNumber: { type: [string, 'null'] }
        cadre: { type: [string, 'null'] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              roleName: { type: string }
              facilityId: { type: [string, 'null'] }
              facilityName: { type: [string, 'null'] }
              departmentId: { type: [string, 'null'] }
              departmentName: { type: [string, 'null'] }
    PatientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string, example: '99001-2026-000042' }
        fullName: { type: string }
        sex: { type: string, enum: [male, female, intersex, unknown] }
        dateOfBirth: { type: string, format: date }
        dobEstimated: { type: boolean }
        age: { type: string, example: '36 y', description: 'days under 1 month, months under 2 years, then years' }
        phoneMasked: { type: [string, 'null'], example: '07•• ••• 678' }
        isRestricted: { type: boolean }
        matchedBy: { type: string, enum: [mrn, phone, identifier, name] }
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientSummary'
        - type: object
          properties:
            phone: { type: [string, 'null'] }
            identifiers:
              {
                type: array,
                items:
                  {
                    type: object,
                    properties: { type: { type: string }, value: { type: string }, masked: { type: string } },
                  },
              }
            payerSchemes: { type: array, items: { type: object } }
            consents: { type: array, items: { type: object } }
            clinical:
              type: object
              properties:
                canView: { type: boolean }
                reason: { type: string, enum: [ok, no_permission, restricted] }
                breakGlassUntil: { type: [string, 'null'], format: date-time }
            allergies: { type: [array, 'null'], description: null when the caller has no clinical access }
    RegisterPatient:
      type: object
      required: [firstName, lastName, sex]
      description: Give dateOfBirth or estimatedAge.
      properties:
        firstName: { type: string }
        middleName: { type: [string, 'null'] }
        lastName: { type: string }
        sex: { type: string, enum: [male, female, intersex, unknown] }
        dateOfBirth: { type: string, format: date }
        estimatedAge: { type: object, properties: { years: { type: integer }, months: { type: integer } } }
        phone: { type: [string, 'null'] }
        identifiers:
          type: array
          items:
            type: object
            properties:
              type:
                {
                  type: string,
                  enum: [national_id, birth_certificate, passport, alien_id, sha_number, nhif_legacy, other],
                }
              value: { type: string }
        payerScheme:
          {
            type: [object, 'null'],
            properties: { schemeId: { type: string, format: uuid }, memberNumber: { type: string } },
          }
        consents:
          {
            type: array,
            items:
              {
                type: object,
                properties: { consentType: { type: string }, granted: { type: boolean }, method: { type: string } },
              },
          }
        nextOfKin: { type: [object, 'null'] }
        duplicateOverrideReason: { type: string, minLength: 10 }
        clientId: { type: string, format: uuid, description: Client-generated id; repeats return the same patient }
    Me:
      type: object
      properties:
        user: { type: object }
        facility:
          {
            type: [object, 'null'],
            properties: { id: { type: string }, name: { type: string }, kmhflCode: { type: string } },
          }
        facilities: { type: array, items: { type: object } }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        session: { type: object, properties: { idleMinutes: { type: integer }, require2fa: { type: boolean } } }
